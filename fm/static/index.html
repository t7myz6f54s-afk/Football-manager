<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0a0e14">
<meta name="mobile-web-app-capable" content="yes">
<title>Touchline — Football Management Simulation</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="splash">
  <div class="slogo"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M24 12l9.5 7-3.6 11.2H18.1L14.5 19z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M24 3v9M6.5 15.5l8 3.5M41.5 15.5l-8 3.5M11 41l7-10.8M37 41l-7-10.8" stroke="currentColor" stroke-width="2"/></svg></div>
  <h1>TOUCHLINE</h1>
  <p>A football management simulation</p>
  <div class="loader"><i></i></div>
  <p id="splash-msg" class="smsg">Loading…</p>
</div>

<div id="app" class="hidden">
  <header id="topbar">
    <div id="crest">TL</div>
    <div class="club" id="tb-club">—</div>
    <div class="spacer"></div>
    <button class="btn primary" id="btn-continue" title="Advance to the next event"><span class="pp">▶</span><span class="pl">CONTINUE</span></button>
  </header>
  <div id="statusbar">
    <span class="chip" id="tb-date">—</span>
    <span class="chip" id="tb-budget">—</span>
    <span class="chip" id="tb-board">—</span>
    <span class="chip" id="tb-next">—</span>
  </div>
  <div id="main">
    <nav id="nav" aria-label="Sections"></nav>
    <section id="content"></section>
  </div>
  <nav id="tabbar" aria-label="Sections"></nav>
  <div id="sheet"><div id="sheet-panel"><div id="sheet-head"><h2>All sections</h2><button class="btn sm" onclick="closeSheet()">Close</button></div><div id="sheet-grid"></div></div></div>
</div>

<div id="busybar"><i></i></div>
<div id="modal"><div class="box" id="modal-box"></div></div>
<div id="toast-wrap"></div>

<script src="/static/app.js"></script>
</body>
</html>
