org.gradle.jvmargs=-Xmx900m -XX:MaxMetaspaceSize=320m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
# disk-backed local build cache: reuse compiled outputs (python .so, dex, aapt)
# across builds instead of recompiling — disk is cheap here, RAM is not
org.gradle.caching=true
# single worker: keep peak RSS low (no parallel dex/ndk processes)
org.gradle.workers.max=1
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
