plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.touchline.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.touchline.game"
        minSdk 24
        targetSdk 34
        versionCode 14
        versionName "1.11.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // Python's native modules must be extractable on the filesystem
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

chaquopy {
    defaultConfig {
        version "3.13"
        buildPython "/usr/local/bin/python3"
    }
}
